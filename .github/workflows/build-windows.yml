name: Build Windows Standalone Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Native Windows Executable & Installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Windows 64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Windows Executable (.exe)
        run: |
          python build_exe.py

      - name: Verify Executable Exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/JobHunterGermany/JobHunterGermany.exe")) {
            throw "JobHunterGermany.exe was not created in dist/JobHunterGermany/"
          }
          Write-Host "Verified JobHunterGermany.exe exists." -ForegroundColor Green

      - name: Package Windows Installer Zip
        run: |
          python package_release.py

      - name: Upload Installer Asset to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.1.1"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Substring(10)
          }
          Write-Host "Uploading installer asset to release $tag..." -ForegroundColor Cyan
          gh release upload $tag "release/JobHunterGermany_Windows_Installer.zip" --clobber
